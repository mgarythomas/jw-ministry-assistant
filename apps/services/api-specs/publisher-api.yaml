openapi: 3.1.0
info:
  title: Publisher Domain API
  version: 1.0.0
  description: API specification for the Publisher domain, providing endpoints for publisher directory, profile, and portal.
servers:
  - url: /api/v1/publishers
paths:
  /:
    get:
      summary: List all publishers
      operationId: listPublishers
      responses:
        '200':
          description: A list of publishers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Publisher'
    post:
      summary: Create a new publisher
      operationId: createPublisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublisherInput'
      responses:
        '201':
          description: Publisher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publisher'
  /{publisherId}:
    get:
      summary: Get a publisher by ID
      operationId: getPublisher
      parameters:
        - name: publisherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Publisher details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publisher'
        '404':
          description: Publisher not found
    put:
      summary: Update a publisher
      operationId: updatePublisher
      parameters:
        - name: publisherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublisherInput'
      responses:
        '200':
          description: Publisher updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publisher'
        '404':
          description: Publisher not found
    delete:
      summary: Delete a publisher
      operationId: deletePublisher
      parameters:
        - name: publisherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Publisher deleted
        '404':
          description: Publisher not found
  /{publisherId}/transfer:
    post:
      summary: Transfer a publisher
      operationId: transferPublisher
      parameters:
        - name: publisherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPublisherInput'
      responses:
        '200':
          description: Publisher transfer initiated
        '404':
          description: Publisher not found
  /{publisherId}/deactivate:
    post:
      summary: Deactivate a publisher
      operationId: deactivatePublisher
      parameters:
        - name: publisherId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivatePublisherInput'
      responses:
        '200':
          description: Publisher deactivated
        '404':
          description: Publisher not found
components:
  schemas:
    Publisher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [Active, Irregular, Inactive]
        type:
          type: string
          enum: [Publisher, Unbaptized, Regular Pioneer]
        group:
          type: string
        phone:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - status
        - type
        - group
    TransferPublisherInput:
      type: object
      properties:
        destinationCongregation:
          type: string
        transferDate:
          type: string
          format: date
      required:
        - destinationCongregation
        - transferDate
    DeactivatePublisherInput:
      type: object
      properties:
        reason:
          type: string
          enum: [moved, status, inactive, deceased, other]
        notes:
          type: string
      required:
        - reason
    PublisherInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [Active, Irregular, Inactive]
        type:
          type: string
          enum: [Publisher, Unbaptized, Regular Pioneer]
        group:
          type: string
        phone:
          type: string
        email:
          type: string
      required:
        - firstName
        - lastName
        - status
        - type
        - group
