openapi: 3.1.0
info:
  title: Meetings Domain API
  version: 1.0.0
  description: API specification for the Meetings domain, providing endpoints for meeting scheduling and management.
servers:
  - url: /api/v1/meetings
paths:
  /:
    get:
      summary: List all meetings
      operationId: listMeetings
      responses:
        '200':
          description: A list of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
    post:
      summary: Create a new meeting
      operationId: createMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingInput'
      responses:
        '201':
          description: Meeting created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
  /{meetingId}:
    get:
      summary: Get a meeting by ID
      operationId: getMeeting
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Meeting details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '404':
          description: Meeting not found
    put:
      summary: Update a meeting
      operationId: updateMeeting
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingInput'
      responses:
        '200':
          description: Meeting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '404':
          description: Meeting not found
    delete:
      summary: Delete a meeting
      operationId: deleteMeeting
      parameters:
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Meeting deleted
        '404':
          description: Meeting not found
components:
  schemas:
    Meeting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [Midweek, Weekend, Ministry]
        location:
          type: string
        attendance:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - date
        - type
        - createdAt
        - updatedAt
    MeetingInput:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [Midweek, Weekend, Ministry]
        location:
          type: string
        attendance:
          type: integer
      required:
        - title
        - date
        - type
